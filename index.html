<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF5F00">
<title>Agorlab · Launcher de PWAs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF5F00;
    --bg: #FAFAFA;
    --bg-elev: #FFFFFF;
    --text: #111111;
    --text-soft: #555555;
    --border: #E5E5E5;
    --danger: #EF4444;
    --success: #10B981;
    --warning: #F59E0B;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,.06);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
    --transition: .25s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="dark"] {
    --bg: #0E0E10;
    --bg-elev: #18181B;
    --text: #F5F5F5;
    --text-soft: #A1A1AA;
    --border: #2A2A2E;
    --shadow: 0 2px 12px rgba(0,0,0,.4);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    transition: background var(--transition), color var(--transition);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  input, textarea, select, button { font-family: inherit; }

  header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .header-inner {
    display:flex; align-items:center; gap:12px;
    max-width:1200px; margin:0 auto;
  }
  .logo {
    font-weight:700; font-size:20px;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .logo-dot {
    width:12px; height:12px;
    background: var(--accent);
    border-radius: 3px;
    transform: rotate(45deg);
    box-shadow: 0 0 20px var(--accent);
  }
  .search { flex:1; position:relative; }
  .search input {
    width:100%;
    background: var(--bg-elev);
    border:1px solid var(--border);
    color: var(--text);
    padding: 10px 14px 10px 40px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    transition: border var(--transition);
  }
  .search input:focus { outline:none; border-color: var(--accent); }
  .search::before {
    content: "🔍";
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    opacity: .6;
    font-size: 14px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg-elev);
    border:1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 18px;
    transition: all var(--transition);
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn.loading { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hero { max-width:1200px; margin:0 auto; padding: 20px 16px; }
  .hero-card {
    position: relative;
    background: linear-gradient(135deg, var(--accent) 0%, #FF8C42 100%);
    border-radius: var(--radius);
    padding: 28px 24px;
    color: white;
    overflow: hidden;
    cursor: pointer;
    transition: transform var(--transition);
  }
  .hero-card.empty-hero {
    background: linear-gradient(135deg, #2a2a2e 0%, #3f3f46 100%);
    cursor: default;
    text-align: center;
  }
  .hero-card:not(.empty-hero):hover { transform: translateY(-2px); }
  .hero-card::after {
    content:""; position:absolute;
    right:-60px; bottom:-60px;
    width:200px; height:200px;
    background: rgba(255,255,255,.1);
    border-radius: 50%;
  }
  .hero-badge {
    display:inline-block;
    background: rgba(255,255,255,.2);
    backdrop-filter: blur(10px);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .hero h1 { font-size: 24px; margin-bottom: 6px; position: relative; z-index:1; }
  .hero p { opacity: .9; font-size: 14px; position: relative; z-index:1; }

  .categories {
    max-width:1200px; margin:0 auto;
    padding: 8px 16px 16px;
    display:flex; gap:8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: white; }

  section { max-width:1200px; margin:0 auto; padding: 8px 16px 24px; }
  .section-title {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .section-title h2 { font-size: 18px; font-weight: 600; }
  .section-title .count { font-size: 12px; color: var(--text-soft); }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .app-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    gap: 14px;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
  }
  .app-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .app-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
    font-size: 28px;
    background: linear-gradient(135deg, var(--icon-from, var(--accent)), var(--icon-to, #FF8C42));
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .app-info { flex:1; min-width:0; }
  .app-info h3 {
    font-size: 15px; font-weight: 600;
    margin-bottom: 2px;
    display:flex; align-items:center; gap:6px;
  }
  .verified {
    width:14px; height:14px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 9px;
  }
  .app-info .dev { font-size: 12px; color: var(--text-soft); margin-bottom: 4px; }
  .app-info .desc {
    font-size: 13px;
    color: var(--text-soft);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .app-meta {
    position: absolute;
    top: 14px; right: 14px;
    display:flex; flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-size: 11px;
    color: var(--text-soft);
  }
  .app-rating {
    display:flex; align-items:center; gap:2px;
    font-weight: 500;
    color: var(--text);
  }
  .fav-btn {
    position:absolute;
    bottom: 14px; right: 14px;
    background: none; border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: .4;
    transition: all var(--transition);
    padding: 4px;
  }
  .fav-btn:hover, .fav-btn.active { opacity: 1; transform: scale(1.2); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn .2s;
  }
  .modal-overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  .modal {
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto;
  }
  .modal-hero { padding: 20px; display: flex; gap: 16px; align-items: flex-start; }
  .modal-hero .app-icon { width: 72px; height: 72px; font-size: 36px; }
  .modal-hero h2 { font-size: 22px; margin-bottom: 4px; }
  .modal-hero .dev { color: var(--accent); font-size: 13px; font-weight: 500; }
  .modal-actions { padding: 0 20px; display:flex; gap:10px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #E55500; }
  .btn-primary:disabled { background: var(--border); color: var(--text-soft); cursor: not-allowed; }
  .btn-secondary { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: #DC2626; }
  .btn-ghost { background: transparent; color: var(--text-soft); border: none; padding: 8px 12px; font-size: 13px; }
  .btn-ghost:hover { color: var(--accent); }
  .modal-stats {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin: 20px 20px 0;
  }
  .stat-num { font-weight: 600; font-size: 14px; }
  .stat-label { font-size: 11px; color: var(--text-soft); }
  .modal-body { padding: 20px; }
  .modal-body h4 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-soft);
    margin-bottom: 8px;
  }
  .modal-body p { color: var(--text); font-size: 14px; line-height: 1.6; }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    transition: border var(--transition);
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-row-3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .color-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .color-row input[type="color"] {
    width: 44px; height: 44px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
    cursor: pointer;
    background: var(--bg-elev);
  }
  .color-row input[type="text"] { flex:1; min-width: 80px; }
  .checkbox-label {
    display:flex; align-items:center; gap:8px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .checkbox-label input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    margin-bottom: 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    padding: 10px 14px;
    background: none;
    border: none;
    color: var(--text-soft);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .admin-app-list { display:flex; flex-direction:column; gap:8px; }
  .admin-app-item {
    display:flex; align-items:center; gap:12px;
    padding: 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .admin-app-item .app-icon { width: 40px; height: 40px; font-size: 20px; border-radius: 10px; }
  .admin-app-item .info { flex:1; min-width:0; }
  .admin-app-item .info h4 {
    font-size: 14px; margin: 0;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
  }
  .admin-app-item .info p { font-size: 12px; color: var(--text-soft); margin: 0; }
  .admin-app-item .actions { display:flex; gap:6px; }
  .mini-btn {
    width: 32px; height: 32px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    transition: all var(--transition);
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .pin-screen { padding: 30px 20px; text-align:center; }
  .pin-screen h2 { font-size: 20px; margin-bottom: 6px; }
  .pin-screen p { color: var(--text-soft); font-size: 13px; margin-bottom: 20px; }
  .pin-input {
    font-size: 24px !important;
    text-align: center;
    letter-spacing: 8px;
    font-family: 'JetBrains Mono', monospace !important;
  }
  .pin-error { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
  .pin-error.show { display: block; }

  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all var(--transition);
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
  .toast.error { border-color: var(--danger); }
  .toast.success { border-color: var(--success); }
  .toast.warning { border-color: var(--warning); }

  .install-banner {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    padding: 12px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 60;
    max-width: calc(100% - 32px);
  }
  .install-banner.show { display: flex; }

  footer {
    max-width:1200px; margin: 0 auto;
    padding: 30px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  footer .mono { color: var(--accent); }
  .admin-trigger {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    opacity: .5;
    transition: opacity var(--transition);
    margin-bottom: 10px;
    display: inline-block;
  }
  .admin-trigger:hover { opacity: 1; color: var(--accent); }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    background: var(--bg-elev);
    border: 1px solid var(--border);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-soft);
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.offline { background: var(--text-soft); }

  .info-box {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-soft);
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .info-box a { color: var(--accent); text-decoration: none; }
  .info-box a:hover { text-decoration: underline; }
  .info-box code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--border);
  }

  .json-preview {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    max-height: 200px;
    overflow: auto;
    white-space: pre;
    color: var(--text);
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* LOADING SKELETON */
  .skeleton-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    gap: 14px;
  }
  .skeleton-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--border) 25%, var(--bg-elev) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }
  .skeleton-lines { flex:1; }
  .skeleton-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--border) 25%, var(--bg-elev) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 8px;
  }
  .skeleton-line:nth-child(1) { width: 60%; }
  .skeleton-line:nth-child(2) { width: 40%; }
  .skeleton-line:nth-child(3) { width: 90%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (min-width: 768px) {
    .modal { border-radius: 20px; margin-bottom: 20px; }
    .modal-overlay { align-items: center; }
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-dot"></span>
      <span>agorlab</span>
      <span class="mono" style="color:var(--text-soft);font-weight:400;font-size:12px">/launcher</span>
    </div>
    <div class="search">
      <input type="text" id="search" placeholder="Buscar PWAs...">
    </div>
    <button class="icon-btn" id="refreshBtn" title="Recargar apps">🔄</button>
    <button class="icon-btn" id="themeToggle" title="Cambiar tema">🌙</button>
  </div>
</header>

<div class="hero" id="heroWrap"></div>
<div class="categories" id="categories"></div>

<section>
  <div class="section-title">
    <h2 id="sectionTitle">Todas las apps</h2>
    <span class="count" id="sectionCount"></span>
  </div>
  <div class="app-grid" id="appGrid">
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
  </div>
  <div class="empty" id="empty" style="display:none">
    <div class="empty-icon">🔍</div>
    <p>No se encontraron apps</p>
  </div>
</section>

<footer>
  <button class="admin-trigger" id="adminTrigger" title="Admin">🔒</button>
  <p>hecho con ☕ en <span class="mono">agorlab.com</span> · 2026</p>
  <p style="margin-top:4px">ágora + laboratorio = PWAs para el pueblo</p>
</footer>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="install-banner" id="installBanner">
  <span>📱 Instalá Agorlab en tu celu</span>
  <button class="btn btn-primary" id="installBtn" style="flex:0;padding:8px 16px">Instalar</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====== CONSTANTES ======
  const ADMIN_PIN = '46348930';
  const STORAGE_APPS = 'agorlab_apps';
  const STORAGE_FAVS = 'agorlab_favs';

  // ====== UTILIDADES ======
  function saveAppsLocal() {
    localStorage.setItem(STORAGE_APPS, JSON.stringify(APPS));

  function getCategories() {
    const cats = new Set(APPS.map(a => a.category).filter(Boolean));
    return ['Todas', ...Array.from(cats)];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ======================================================
  // 🔑 CARGA PÚBLICA DE APPS (lo que ven TODOS los usuarios)
  // ======================================================
  // Lee apps.json directamente del mismo dominio.
  // No necesita token. GitHub Pages lo sirve como archivo estático.
  // El ?t= evita caché del browser/CDN.
  async function loadAppsPublic(showFeedback = false) {
    try {
      const res = await fetch(`./${GITHUB_FILE_PATH}?t=${Date.now()}`, {
        cache: 'no-store'
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (Array.isArray(data)) {
        APPS = data;
        saveAppsLocal(); // cache local por si falla la red después
        renderAll();
        if (showFeedback) showToast(`✅ ${APPS.length} apps cargadas`);
        return true;
      }
      throw new Error('Formato inválido');
    } catch (err) {
      console.warn('No se pudo leer apps.json del sitio:', err.message);
      // Fallback: localStorage (modo admin sin deploy todavía)
      APPS = JSON.parse(localStorage.getItem(STORAGE_APPS) || '[]');
      renderAll();
      if (showFeedback) showToast('Usando datos locales (apps.json no disponible)', 'warning');
      return false;
    }
  }

  // ======================================================
  // 🔐 ESCRITURA A GITHUB (solo admin, con token)
  // ======================================================
  async function githubApi(method, path, body = null) {
    if (!githubConfig?.token) throw new Error('GitHub no configurado');
    const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}${path}`;
    const opts = {
      method,
      headers: {
        'Authorization': `Bearer ${githubConfig.token}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function pushToGitHub(commitMessage = 'update apps') {
    if (!githubConfig?.token) return false;
    try {
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(APPS, null, 2))));
      const body = { message: commitMessage, content };
      if (currentSha) {
        body.sha = currentSha;
      } else {
        try {
          const existing = await githubApi('GET', `/contents/${GITHUB_FILE_PATH}`);
          body.sha = existing.sha;
          currentSha = existing.sha;
        } catch {}
      }
      const res = await githubApi('PUT', `/contents/${GITHUB_FILE_PATH}`, body);
      currentSha = res.content.sha;
      return true;
    } catch (err) {
      console.error('GitHub push error:', err);
      showToast(`Error al subir: ${err.message}`, 'error');
      return false;
    }
  }

  async function saveApps() {
    saveAppsLocal();
    renderAll();
    if (githubConfig?.token) {
      showToast('Subiendo a GitHub...');
      const ok = await pushToGitHub(editingAppId ? 'edit app' : 'add app');
      if (ok) {
        showToast('✅ Guardado y subido a GitHub');
        // Recargar desde el sitio para confirmar (esperando deploy)
        setTimeout(() => loadAppsPublic(false), 3000);
      }
    } else {
      showToast('💾 Guardado local (configurá GitHub para publicar)');
    }
  }

  function renderApps() {
    const grid = document.getElementById('appGrid');
    const empty = document.getElementById('empty');
    const filtered = APPS.filter(app => {
      const matchCat = activeCategory === 'Todas' || app.category === activeCategory;
      const q = searchQuery;
      const matchSearch = !q ||
        (app.name || '').toLowerCase().includes(q) ||
        (app.desc || '').toLowerCase().includes(q) ||
        (app.category || '').toLowerCase().includes(q);
      return matchCat && matchSearch;
    });

    document.getElementById('sectionTitle').textContent =
      activeCategory === 'Todas' ? 'Todas las apps' : activeCategory;
    document.getElementById('sectionCount').textContent = `${filtered.length} app${filtered.length===1?'':'s'}`;

    if (filtered.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    grid.style.display = 'grid';
    empty.style.display = 'none';

    grid.innerHTML = filtered.map(app => `
      <div class="app-card" data-id="${app.id}">

        <div class="form-row">
          <div class="form-group">
            <label>Owner (usuario/org)</label>
            <input type="text" name="owner" required placeholder="agorlab" value="${escapeHtml(cfg.owner)}">
          </div>
          <div class="form-group">
            <label>Repo</label>
            <input type="text" name="repo" required placeholder="agorlab.com" value="${escapeHtml(cfg.repo)}">
          </div>
        </div>
        <div class="form-group">
          <label>Branch</label>
          <input type="text" name="branch" placeholder="main" value="${escapeHtml(cfg.branch || 'main')}">
        </div>
        <div class="form-group">
          <label>Personal Access Token</label>
          <input type="password" name="token" required placeholder="ghp_..." value="${escapeHtml(cfg.token)}">
          <p style="font-size:11px;color:var(--text-soft);margin-top:6px">
            Solo necesita permiso <code>Contents: Read and write</code>. Se guarda en tu browser, no se comparte.
          </p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" class="btn btn-secondary" id="testBtn" style="flex:1;min-width:140px">
            🔌 Probar conexión
          </button>
          <button type="submit" class="btn btn-primary" style="flex:1;min-width:140px">
            💾 Guardar config
          </button>
        </div>
        ${cfg.token ? `
          <button type="button" class="btn btn-danger" id="clearGhBtn" style="margin-top:10px;width:100%">
            ❌ Desconectar GitHub
          </button>
        ` : ''}
      </form>
      <div id="testResult" style="margin-top:14px"></div>
    `;
    const form = document.getElementById('ghForm');
    const testBtn = document.getElementById('testBtn');
    const result = document.getElementById('testResult');

    testBtn.addEventListener('click', async () => {
      const fd = new FormData(form);
      const tempCfg = {
        owner: fd.get('owner').trim(),
        repo: fd.get('repo').trim(),
        token: fd.get('token').trim(),
        branch: fd.get('branch').trim() || 'main'
      };
      if (!tempCfg.owner || !tempCfg.repo || !tempCfg.token) {
        result.innerHTML = `<div class="info-box" style="border-left-color:var(--danger);color:var(--danger)">Completá todos los campos</div>`;
        return;
      }
      testBtn.disabled = true;
      testBtn.textContent = 'Probando...';
      try {
        const oldCfg = githubConfig;
        githubConfig = tempCfg;
        const repo = await githubApi('GET', '');
        result.innerHTML = `
          <div class="info-box" style="border-left-color:var(--success)">
            ✅ Conectado a <strong>${repo.full_name}</strong>
            <br>Permisos OK. Ya podés guardar.
          </div>`;
        githubConfig = oldCfg;
      } catch (err) {
        result.innerHTML = `
          <div class="info-box" style="border-left-color:var(--danger);color:var(--danger)">
            ❌ Error: ${escapeHtml(err.message)}
          </div>`;
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = '🔌 Probar conexión';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      githubConfig = {
        owner: fd.get('owner').trim(),
        repo: fd.get('repo').trim(),
        token: fd.get('token').trim(),
        branch: fd.get('branch').trim() || 'main'
      };
      localStorage.setItem(STORAGE_GITHUB, JSON.stringify(githubConfig));
      showToast('✅ Config de GitHub guardada');
      if (APPS.length > 0) {
        const ok = await pushToGitHub('sync from admin panel');
        if (ok) showToast('🚀 Apps subidas a GitHub');
      }
      renderAdminTab('github');
    });

    const clearBtn = document.getElementById('clearGhBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        if (confirm('¿Desconectar GitHub? Las apps seguirán en localStorage.')) {
          githubConfig = null;
          currentSha = null;
          localStorage.removeItem(STORAGE_GITHUB);
          showToast('Modo local activado');
          renderAdminTab('github');
        }
      });
    }
  }

  function renderAdminData(c) {
    c.innerHTML = `
      <p style="color:var(--text-soft);font-size:13px;margin-bottom:14px">
        Backup manual del JSON. Útil para migrar entre dispositivos.
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="exportBtn" style="flex:1;min-width:140px">
          ⬇️ Descargar apps.json
        </button>
        <button class="btn btn-secondary" id="copyBtn" style="flex:1;min-width:140px">
          📋 Copiar JSON
        </button>
      </div>
      <div class="form-group" style="margin-top:18px">
        <label>Preview JSON</label>
        <div class="json-preview" id="jsonPreview"></div>
      </div>
      <div class="form-group">
        <label>Importar JSON (pegar y restaurar)</label>
        <textarea id="importArea" placeholder='[{"id":...}]'></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary" id="importBtn" style="flex:1">⬆️ Importar</button>
        <button class="btn btn-danger" id="clearBtn" style="flex:1">🧹 Borrar todo</button>
      </div>
    `;
    document.getElementById('jsonPreview').textContent = JSON.stringify(APPS, null, 2);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(APPS, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'apps.json'; a.click();
      URL.revokeObjectURL(url);
      showToast('apps.json descargado ⬇️');
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(JSON.stringify(APPS, null, 2));
        showToast('JSON copiado 📋');
      } catch { showToast('No se pudo copiar', 'error'); }
    });
    document.getElementById('importBtn').addEventListener('click', async () => {
      const raw = document.getElementById('importArea').value.trim();
      if (!raw) return showToast('Pegá un JSON', 'error');
      try {
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) throw new Error('No es array');
        APPS = data;
        await saveApps();
        renderAdminData(c);
        showToast('JSON importado ⬆️');
      } catch (err) { showToast('JSON inválido', 'error'); }
    });
    document.getElementById('clearBtn').addEventListener('click', async () => {
      if (confirm('¿Borrar TODAS las apps?')) {
        APPS = [];
        await saveApps();
        renderAdminData(c);
        showToast('Todo borrado', 'error');
      }
    });
  }

  // ====== INSTALL PWA ======
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
    document.getElementById('installBanner').classList.add('show');
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    const { outcome } = await deferredInstall.userChoice;
    if (outcome === 'accepted') document.getElementById('installBanner').classList.remove('show');
    deferredInstall = null;
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('installBanner').classList.remove('show');
    deferredInstall = null;
  });

  // ====== INIT ======
  function renderAll() {
    renderHero();
    renderCategories();
    renderApps();
  }

  // 🔑 Carga inicial: siempre lee del sitio público primero
  loadAppsPublic(false);
</script>

</body>
</html>
